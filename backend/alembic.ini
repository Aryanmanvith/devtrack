# Alembic configuration for the command line, e.g. from the backend/ folder:
#   python -m alembic upgrade head
#   python -m alembic revision --autogenerate -m "add a column"
# The application also runs "upgrade head" automatically at startup.
# The database URL comes from app.config (DEVTRACK_DATABASE_URL), not from this file.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
