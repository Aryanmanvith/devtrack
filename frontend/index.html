<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="DevTrack: plan projects, track tasks and issues, ship together."
    />
    <meta name="theme-color" content="#17181c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>DevTrack</title>
    <script>
      // Apply the last known theme before first paint to avoid a flash of the wrong theme.
      // The saved preference on the server is applied again once the app loads.
      ;(function () {
        try {
          var stored = localStorage.getItem('devtrack-theme')
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : stored === 'system' && prefersLight
                ? 'light'
                : 'dark'
          document.documentElement.classList.toggle('dark', theme === 'dark')
          document.documentElement.classList.toggle('light', theme === 'light')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>DevTrack needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
