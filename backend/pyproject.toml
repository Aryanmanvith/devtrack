[project]
name = "devtrack-backend"
version = "1.0.0"
description = "FastAPI backend for DevTrack, a student project and issue tracker."
requires-python = ">=3.12"
readme = "../README.md"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Starlette 1.x prefers the newer httpx2 package but fully supports HTTPX, which this
    # project uses for API tests as specified. Silence only that notice.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PIE"]
# FastAPI relies on Depends()/Query() calls in parameter defaults.
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
